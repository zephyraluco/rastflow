# 持续交付：打包 NSIS 安装包，可选发布为 GitHub Release
#
# 触发：推 v* 标签（测完打包并发布），或手动触发（默认只构建并上传产物，
# 勾选 publish 并填 tag 才发 Release）。打包由 Cargo.toml 的
# [package.metadata.packager] 驱动，beforePackagingCommand 会先跑
# cargo build --release，因此这里不需要单独的构建步骤。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub Release (otherwise only build and upload the artifacts)
        type: boolean
        default: false
      tag:
        description: Tag to publish, e.g. v0.1.0 (required when publish is true)
        type: string
        required: false

# 创建 Release 需要写权限；仓库默认只给读，所以显式声明
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # 推标签用标签本身；手动触发用输入的 tag。两边都为空时不发布。
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
  # 推标签一律发布；手动触发看 publish 开关
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  # 标签可能指向任何提交，所以发版前重新验一遍，避免把坏的产物发出去
  verify:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: cargo test
        run: cargo test --locked

  package:
    name: Package
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # cargo-packager 无预编译分发，源码安装偏慢，交给这个 action 缓存编译结果
      - name: Install cargo-packager
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-packager
          version: '0.11.8'

      # 安装包文件名嵌着版本号，标签与 Cargo.toml 不符会产出名实不副的包
      - name: Check the tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $manifest = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+?)"').Matches[0].Groups[1].Value
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          if ($manifest -ne $tag) {
            Write-Error "tag v$tag does not match the Cargo.toml version $manifest"
            exit 1
          }
          Write-Output "versions match: $manifest"

      - name: cargo packager
        run: cargo packager --release

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, Length

      # 只传安装包本体。glob 写到 .exe 为止：dist/*setup.exe* 会连本地签名
      # 产出的 .sig 一并带上
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: rastflow-setup
          path: dist/*setup.exe
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*setup.exe
