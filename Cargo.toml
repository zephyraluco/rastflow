[package]
name = "rastflow"
version = "0.1.0"
edition = "2024"
authors = ["zephyraluco <zephyraluco@gmail.com>"]
description = "基于 Rust + GPUI 的 Windows 快速启动器"
license = "Apache-2.0"

# ── cargo-packager 打包配置 ──────────────────────────────────────────────
# 打包：cargo packager --release
#
# 放在 Cargo.toml 而不是独立的 Packager.toml 是有原因的：只有这条路径下
# cargo-packager 才会用 cargo metadata 自动推导 binaries / binariesDir / outDir
# （见 cli/config.rs 的 load_configs_from_cargo_workspace）。独立配置文件里
# 这些必须手写，且 binariesDir 只能写死 target/release，一旦改了
# CARGO_TARGET_DIR 就会失效。
#
# 键名是 camelCase：Config 结构体为 #[serde(rename_all = "camelCase",
# deny_unknown_fields)]，官网文档里 TOML 示例的 kebab-case 写法是错的。
[package.metadata.packager]
productName = "rastflow"
# 反向域名，安装信息、开始菜单快捷方式与卸载注册表项都用它。
# 注意 publisher 默认取这里的第二段（zephyraluco）。
identifier = "com.zephyraluco.rastflow"
longDescription = "rastflow 是一个常驻托盘的 Windows 快速启动器：全局快捷键唤出，搜索并快速启动本机程序，并可切换到文件搜索模式按文件名搜索全盘文件（索引由程序自己维护）。"
category = "Utility"
licenseFile = "LICENSE"

# 装包时先构建 release 二进制
beforePackagingCommand = "cargo build --release"

# 只做 MSI（WiX）：安装器本身就是 perMachine + 提权的，正好用来注册索引服务。
#
# 为什么不用 NSIS：cargo-packager 的 NSIS 模板只开放一个 `preinstallSection`，
# 而它插在 `Section Install` **之前** —— 那时 $INSTDIR 里还没有 exe，没法注册服务；
# 更要紧的是 NSIS 模板根本没有卸载钩子，服务会残留。WiX 有完整的
# InstallExecuteSequence，可以精确控制「装完起服务、卸载前停服务」。
#
# WiX 二进制由 cargo-packager 自动从 GitHub 下载到本地缓存
# （wix311-binaries.zip → <tools>/WixTools），本机不需要预装 WiX Toolset，
# 但**首次打包需要联网**。
formats = ["wix"]

outDir = "dist"

# 安装器图标与快捷方式图标。exe 自身的图标由 build.rs 通过 winresource 嵌入。
icons = ["assets/app-icon.ico"]

[package.metadata.packager.wix]
# 索引服务的生命周期（安装 / 卸载 / 升级）都写在这个片段里。
# 路径相对 `cargo packager` 的工作目录。
fragmentPaths = ["packaging/rastflow-service.wxs"]
# 片段里定义的 CustomAction 必须在这里列出来，才会被 main.wxs 引用
customActionRefs = [
    "InstallIndexService",
    "RollbackIndexService",
    "UninstallIndexService",
]
# MSI 界面语言（同时影响生成的 msi 文件名后缀）。
# 标识符必须是 cargo-packager 内置 languages.json 里的键。
languages = ["zh-CN"]

[package.metadata.packager.windows]
# 不允许用旧版本覆盖已装的新版本，避免降级后数据不兼容
allowDowngrades = false

[dependencies]
gpui = { version = "0.3", package = "gpui-pre" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", default-features = false, features = ["component"] }
# 没有用 tray-icon：系统托盘与右键菜单由 src/tray.rs 直连 Win32 实现
# （Shell_NotifyIconW + TrackPopupMenu），少一棵依赖树。
global-hotkey = "0.8"
raw-window-handle = "0.6"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8"
# 注意：这里**没有** sqlx / tokio。应用列表数据（applist.db）用 rusqlite 同步读写，
# 不需要异步 runtime；自研搜索核心的索引是常驻内存的（src/search/index.rs），
# 磁盘上只有一个自定义二进制快照，所以索引层也不需要 SQLite。
# 用于构造 gpui 的 RenderImage 与图标缩放（版本须与 gpui-pre 一致）
image = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # CreateFileW 参数里的 SECURITY_ATTRIBUTES（传 None 也需要类型可见）
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    # DeviceIoControl / CancelSynchronousIo
    "Win32_System_IO",
    # FSCTL_* 常量与 MFT_ENUM_DATA_V0 / USN_RECORD_V2 等 USN 结构体
    "Win32_System_Ioctl",
    # 命名管道：主进程与提权索引子进程之间的唯一通道
    "Win32_System_Pipes",
    # 索引服务：SCM 注册、启停、服务主函数
    "Win32_System_Services",
    # 进程快照：判断服务是不是由 services.exe 拉起的
    "Win32_System_Diagnostics_ToolHelp",
    # OpenThread（用于中断阻塞在 USN 读取上的线程）
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_Registry",
] }

[target.'cfg(windows)'.build-dependencies]
# 把 assets/app-icon.ico 与版本信息写进 exe 的资源段，
# 否则打包出来的程序在资源管理器/任务栏里是默认空白图标。
winresource = "0.1"
